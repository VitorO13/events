
<!doctype html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#12233f"
    >

    <meta
        name="description"
        content="Plataforma de Eventos Acadêmicos. Explore eventos, consulte a programação e organize sua agenda."
    >

    <title>
        Plataforma de Eventos Acadêmicos
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- ================================================
         CABEÇALHO
         ================================================ -->

    <header class="topbar">

        <!-- Nome e identidade da plataforma -->

        <a
            class="brand"
            href="#inicio"
            aria-label="Plataforma de Eventos Acadêmicos - Início"
        >

            <span
                class="brand-mark"
                aria-hidden="true"
            >
                ✦
            </span>

            <span>
                Plataforma de
                <span class="brand-accent">
                    Eventos Acadêmicos
                </span>

                <small>
                    PORTAL ACADÊMICO
                </small>
            </span>

        </a>


        <!-- Botão do menu para dispositivos móveis -->

        <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="nav"
        >
            ☰ Menu
        </button>


        <!-- Navegação principal -->

        <nav
            id="nav"
            aria-label="Navegação principal"
        >

            <a
                href="#inicio"
                data-nav="inicio"
            >
                Início
            </a>

            <a
                href="#eventos"
                data-nav="eventos"
            >
                Eventos
            </a>

            <a
                href="#programacao"
                data-nav="programacao"
            >
                Programação
            </a>

            <a
                href="#minha-agenda"
                data-nav="minha-agenda"
            >
                Minha agenda
            </a>

            <a
                href="#minhas-inscricoes"
                data-nav="minhas-inscricoes"
            >
                Inscrições
            </a>

            <a
                href="#avaliacoes"
                data-nav="avaliacoes"
            >
                Avaliações
            </a>

        </nav>


        <!-- Acesso do participante -->

        <button
            class="login-btn"
            id="login-btn"
            type="button"
        >
            Entrar / Cadastrar
        </button>

    </header>


    <!-- ================================================
         CONTEÚDO PRINCIPAL
         ================================================ -->

    <!--
        As páginas da plataforma são carregadas
        dinamicamente pelo arquivo script.js.
    -->

    <main
        id="app"
        tabindex="-1"
    ></main>


    <!-- ================================================
         RODAPÉ
         ================================================ -->

    <footer>

        <div>

            <strong>
                ✦ Plataforma de Eventos Acadêmicos
            </strong>

            <p>
                Plataforma de Gestão de Eventos Acadêmicos
            </p>

        </div>

    </footer>


    <!-- ================================================
         MENSAGENS TEMPORÁRIAS
         ================================================ -->

    <!--
        Este elemento exibe as notificações geradas
        pela função notify() do JavaScript.
    -->

    <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
    ></div>


    <!-- ================================================
         JAVASCRIPT
         ================================================ -->

    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
