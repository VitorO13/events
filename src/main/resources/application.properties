spring.application.name=eventplataform
# Configurações de Conexão com o MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/events
spring.datasource.username=amairvidro
spring.datasource.password=vitor13
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configurações do Hibernate (JPA)
# 'update' cria ou atualiza as tabelas automaticamente de acordo com suas Entidades Java
spring.jpa.hibernate.ddl-auto=update

# Exibe no terminal do VS Code os comandos SQL que o Spring está executando no banco
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true